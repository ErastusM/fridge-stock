# Publishes the in-browser DEMO (no server, sample data on each device) to GitHub Pages.
# The real app needs the API and Postgres and is deployed separately.
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace web --include-workspace-root
      - run: npm test --workspace web
      - run: npm run build:demo --workspace web
      # Pages has no SPA fallback; the demo routes by hash, this only covers a mistyped path.
      - run: cp web/dist-demo/index.html web/dist-demo/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
