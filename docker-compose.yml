services:
  db:
    image: postgres:16-alpine
    container_name: fridge-stock-pg
    environment:
      POSTGRES_USER: fridge
      POSTGRES_PASSWORD: fridge_dev_pw
      POSTGRES_DB: fridge
    # Published on loopback only: a laptop's Docker ports are otherwise reachable from the office Wi-Fi.
    ports:
      - "127.0.0.1:55480:5432"
    volumes:
      - fridge-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridge"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  fridge-pg: {}
